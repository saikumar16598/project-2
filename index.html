<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello, Sai ✨</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap");

      :root {
        --ink: #fffaf5;
        --muted: rgba(255, 250, 245, 0.78);
        --glass: rgba(255, 255, 255, 0.12);
        --glass-border: rgba(255, 255, 255, 0.3);
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 20%, #ffb38a 0, transparent 31%),
          radial-gradient(circle at 82% 25%, #b999ff 0, transparent 30%),
          radial-gradient(circle at 54% 88%, #64d8d0 0, transparent 36%),
          linear-gradient(135deg, #24134f, #7d306c 52%, #d05f5b);
        font-family: "DM Sans", sans-serif;
      }

      .orb {
        position: absolute;
        width: 22rem;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(3px);
        opacity: 0.48;
        animation: drift 12s ease-in-out infinite alternate;
      }

      .orb.one { top: -10rem; right: -5rem; background: #ffe088; }
      .orb.two { bottom: -12rem; left: -7rem; background: #9df3e9; animation-delay: -4s; }

      .card {
        position: relative;
        z-index: 1;
        width: min(90vw, 690px);
        padding: clamp(2.3rem, 7vw, 5.2rem);
        text-align: center;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 32px;
        box-shadow: 0 28px 70px rgba(26, 5, 50, 0.32);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        animation: appear 850ms cubic-bezier(.2,.8,.2,1) both;
      }

      nav {
        position: absolute;
        top: 1.45rem;
        right: 1.65rem;
        display: flex;
        gap: 0.25rem;
      }

      nav a {
        padding: 0.5rem 0.72rem;
        border-radius: 999px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        text-decoration: none;
        transition: color 160ms ease, background 160ms ease;
      }

      nav a:hover, nav a[aria-current="page"] {
        color: var(--ink);
        background: rgba(255,255,255,.14);
      }

      .sparkle {
        display: inline-grid;
        place-items: center;
        width: 4.3rem;
        aspect-ratio: 1;
        margin-bottom: 1.25rem;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.17);
        font-size: 2rem;
        box-shadow: inset 0 1px 1px rgba(255,255,255,.38);
        animation: glow 2.5s ease-in-out infinite;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(3.4rem, 11vw, 6.9rem);
        font-weight: 600;
        line-height: 0.97;
        letter-spacing: -0.065em;
      }

      h1 em {
        color: #ffe5a3;
        font-style: italic;
      }

      .message {
        max-width: 29rem;
        margin: 1.65rem auto 2.1rem;
        color: var(--muted);
        font-size: clamp(1rem, 2.5vw, 1.2rem);
        line-height: 1.65;
      }

      .button {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.87rem 1.3rem;
        border: 1px solid rgba(255,255,255,.36);
        border-radius: 999px;
        color: #43235c;
        background: #fff9ee;
        box-shadow: 0 8px 22px rgba(45, 13, 72, .2);
        font: 700 0.94rem "DM Sans", sans-serif;
        cursor: pointer;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .button:hover { transform: translateY(-3px); box-shadow: 0 13px 28px rgba(45, 13, 72, .28); }
      .button:active { transform: translateY(0); }

      .wish {
        min-height: 1.5em;
        margin: 1.25rem 0 0;
        color: #fff1c9;
        font-size: 0.95rem;
        font-weight: 500;
      }

      @keyframes appear {
        from { opacity: 0; transform: translateY(24px) scale(.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes drift { to { transform: translate(3rem, 2rem) scale(1.08); } }
      @keyframes glow { 50% { transform: scale(1.1) rotate(8deg); } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="orb one"></div>
    <div class="orb two"></div>

    <main class="card">
      <nav aria-label="Main navigation">
        <a href="index.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="sparkle" aria-hidden="true">✦</div>
      <p class="eyebrow">A little moment for you</p>
      <h1>Hello, <em>Sai</em>.</h1>
      <p class="message">May today bring you bright ideas, calm confidence, and a few lovely surprises along the way.</p>
      <button class="button" id="wishButton" type="button">Send a little sparkle <span aria-hidden="true">→</span></button>
      <p class="wish" id="wish" aria-live="polite"></p>
    </main>

    <script>
      const wishes = [
        "✨ You’ve got this, Sai!",
        "🌟 Today is full of possibility.",
        "💫 A wonderful day is waiting for you.",
        "☀️ Keep shining in your own way."
      ];
      let currentWish = 0;

      document.getElementById("wishButton").addEventListener("click", () => {
        document.getElementById("wish").textContent = wishes[currentWish];
        currentWish = (currentWish + 1) % wishes.length;
      });
    </script>
  </body>
</html>
