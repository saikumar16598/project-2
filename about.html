<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Sai ✦</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap");
      :root { --ink:#fffaf5; --muted:rgba(255,250,245,.78); --glass:rgba(255,255,255,.12); --border:rgba(255,255,255,.3); }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; overflow:hidden; color:var(--ink); background:radial-gradient(circle at 18% 18%,#a4d3ff 0,transparent 30%),radial-gradient(circle at 82% 75%,#ff9ba8 0,transparent 34%),linear-gradient(135deg,#142a59,#53418a 50%,#a8547a); font-family:"DM Sans",sans-serif; }
      .orb { position:absolute; width:23rem; aspect-ratio:1; border-radius:50%; opacity:.38; filter:blur(4px); animation:drift 13s ease-in-out infinite alternate; }
      .orb.one { top:-12rem; right:-6rem; background:#f8e28b; } .orb.two { bottom:-13rem; left:-6rem; background:#8de3df; animation-delay:-5s; }
      .card { position:relative; z-index:1; width:min(90vw,720px); padding:clamp(5.5rem,9vw,6.4rem) clamp(2.2rem,7vw,5.2rem) clamp(2.5rem,7vw,4.6rem); background:var(--glass); border:1px solid var(--border); border-radius:32px; box-shadow:0 28px 70px rgba(14,17,57,.32); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); animation:appear .85s cubic-bezier(.2,.8,.2,1) both; }
      nav { position:absolute; top:1.45rem; right:1.65rem; display:flex; gap:.25rem; } nav a { padding:.5rem .72rem; border-radius:999px; color:var(--muted); font-size:.82rem; font-weight:700; text-decoration:none; transition:color .16s ease,background .16s ease; } nav a:hover,nav a[aria-current="page"] { color:var(--ink); background:rgba(255,255,255,.14); }
      .eyebrow { margin:0 0 .7rem; color:#d9f5ff; font-size:.76rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }
      h1 { margin:0; font-family:"Playfair Display",Georgia,serif; font-size:clamp(3rem,9vw,5.5rem); line-height:1; letter-spacing:-.055em; } h1 em { color:#ffe5a3; font-style:italic; }
      .intro { max-width:36rem; margin:1.4rem 0 2rem; color:var(--muted); font-size:1.08rem; line-height:1.68; }
      .facts { display:grid; grid-template-columns:repeat(3,1fr); gap:.75rem; }
      .fact { padding:1rem .75rem; border:1px solid rgba(255,255,255,.2); border-radius:18px; background:rgba(255,255,255,.08); text-align:center; } .fact span { display:block; margin-bottom:.35rem; font-size:1.25rem; } .fact strong { font-size:.85rem; }
      @keyframes appear { from { opacity:0; transform:translateY(24px) scale(.97); } to { opacity:1; transform:translateY(0) scale(1); } } @keyframes drift { to { transform:translate(3rem,2rem) scale(1.08); } }
      @media (max-width:480px) { .facts { grid-template-columns:1fr; } } @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
    </style>
  </head>
  <body>
    <div class="orb one"></div><div class="orb two"></div>
    <main class="card">
      <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html" aria-current="page">About</a><a href="contact.html">Contact</a></nav>
      <p class="eyebrow">A little introduction</p>
      <h1>Meet <em>Sai</em>.</h1>
      <p class="intro">This is a space for the ideas, energy, and small moments that make Sai unique. Thoughtful, curious, and always moving toward the next bright possibility.</p>
      <section class="facts" aria-label="Sai highlights">
        <div class="fact"><span aria-hidden="true">✦</span><strong>Big ideas</strong></div>
        <div class="fact"><span aria-hidden="true">☀</span><strong>Warm energy</strong></div>
        <div class="fact"><span aria-hidden="true">↗</span><strong>Growing daily</strong></div>
      </section>
    </main>
  </body>
</html>
