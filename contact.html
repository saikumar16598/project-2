<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Sai ✉</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap");
      :root { --ink:#fffaf5; --muted:rgba(255,250,245,.78); --glass:rgba(255,255,255,.12); --border:rgba(255,255,255,.3); }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; overflow:hidden; color:var(--ink); background:radial-gradient(circle at 20% 80%,#ffcf89 0,transparent 30%),radial-gradient(circle at 80% 20%,#e89cff 0,transparent 33%),linear-gradient(135deg,#44205e,#875064 53%,#d17a51); font-family:"DM Sans",sans-serif; }
      .orb { position:absolute; width:23rem; aspect-ratio:1; border-radius:50%; opacity:.38; filter:blur(4px); animation:drift 13s ease-in-out infinite alternate; }.orb.one { top:-11rem; right:-6rem; background:#ffe681; }.orb.two { bottom:-13rem; left:-6rem; background:#ffa5c2; animation-delay:-5s; }
      .card { position:relative; z-index:1; width:min(90vw,690px); padding:clamp(5.5rem,9vw,6.1rem) clamp(2.2rem,7vw,5rem) clamp(2.4rem,7vw,4.2rem); background:var(--glass); border:1px solid var(--border); border-radius:32px; box-shadow:0 28px 70px rgba(47,14,47,.32); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); animation:appear .85s cubic-bezier(.2,.8,.2,1) both; }
      nav { position:absolute; top:1.45rem; right:1.65rem; display:flex; gap:.25rem; } nav a { padding:.5rem .72rem; border-radius:999px; color:var(--muted); font-size:.82rem; font-weight:700; text-decoration:none; transition:color .16s ease,background .16s ease; } nav a:hover,nav a[aria-current="page"] { color:var(--ink); background:rgba(255,255,255,.14); }
      .eyebrow { margin:0 0 .7rem; color:#ffe8a8; font-size:.76rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase; } h1 { margin:0; font-family:"Playfair Display",Georgia,serif; font-size:clamp(3rem,9vw,5.5rem); line-height:1; letter-spacing:-.055em; } h1 em { color:#fff0b3; font-style:italic; }.lead { margin:1.2rem 0 1.7rem; color:var(--muted); font-size:1.05rem; line-height:1.65; }
      form { display:grid; gap:.85rem; } label { color:#fff5db; font-size:.83rem; font-weight:700; } input,textarea { width:100%; margin-top:.35rem; padding:.8rem .9rem; border:1px solid rgba(255,255,255,.25); border-radius:12px; outline:none; color:var(--ink); background:rgba(255,255,255,.1); font:inherit; } input::placeholder,textarea::placeholder { color:rgba(255,255,255,.58); } input:focus,textarea:focus { border-color:#fff0b3; box-shadow:0 0 0 3px rgba(255,240,179,.16); } textarea { min-height:6.2rem; resize:vertical; } button { justify-self:start; padding:.8rem 1.2rem; border:0; border-radius:999px; color:#572c4a; background:#fff8e9; box-shadow:0 8px 22px rgba(45,13,72,.2); font:700 .9rem "DM Sans",sans-serif; cursor:pointer; transition:transform .18s ease; } button:hover { transform:translateY(-2px); } #status { min-height:1.3em; margin:0; color:#fff0b3; font-size:.9rem; font-weight:500; }
      @keyframes appear { from { opacity:0; transform:translateY(24px) scale(.97); } to { opacity:1; transform:translateY(0) scale(1); } } @keyframes drift { to { transform:translate(3rem,2rem) scale(1.08); } } @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
    </style>
  </head>
  <body>
    <div class="orb one"></div><div class="orb two"></div>
    <main class="card">
      <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
      <p class="eyebrow">Let’s connect</p>
      <h1>Say <em>hello</em>.</h1>
      <p class="lead">Have a thought, a kind word, or an exciting idea? Leave a message for Sai.</p>
      <form id="contactForm">
        <label>Your name<input type="text" name="name" placeholder="What should Sai call you?" required /></label>
        <label>Your message<textarea name="message" placeholder="Write something lovely..." required></textarea></label>
        <button type="submit">Send message ✦</button>
      </form>
      <p id="status" aria-live="polite"></p>
    </main>
    <script>
      document.getElementById("contactForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const name = new FormData(event.currentTarget).get("name");
        document.getElementById("status").textContent = `Thanks, ${name}! Your message is ready to send.`;
        event.currentTarget.reset();
      });
    </script>
  </body>
</html>
